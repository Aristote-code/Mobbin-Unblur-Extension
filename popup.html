<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ScreenClear for Mobbin</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img src="icons/icon-128.png" width="48" height="48" alt="">
        <div>
          <h1>ScreenClear</h1>
          <p>for Mobbin</p>
        </div>
      </header>

      <section class="control" aria-labelledby="active-label">
        <span class="active-icon" aria-hidden="true"></span>
        <div>
          <strong id="active-label">Active automatically</strong>
          <span id="status">Checking this tab…</span>
        </div>
      </section>

      <button id="refresh" type="button" disabled>Refresh previews</button>

      <p class="privacy"><span aria-hidden="true">●</span> Runs only on mobbin.com. No analytics or data collection.</p>
      <p class="disclaimer">Unofficial. Not affiliated with or endorsed by Mobbin.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
